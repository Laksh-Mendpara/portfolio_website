<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="50%" style="stop-color:#00ffff"/>
      <stop offset="100%" style="stop-color:#bf00ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="15" fill="#0a0a0f"/>
  <text x="50" y="62" font-family="monospace" font-size="50" font-weight="bold" fill="url(#grad)" text-anchor="middle" filter="url(#glow)">L</text>
  <circle cx="20" cy="20" r="3" fill="#00ff88" opacity="0.8"/>
  <circle cx="80" cy="80" r="2" fill="#bf00ff" opacity="0.8"/>
  <circle cx="75" cy="25" r="2.5" fill="#00ffff" opacity="0.8"/>
</svg>
